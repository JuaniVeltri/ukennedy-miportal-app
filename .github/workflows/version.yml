name: Publicar versión

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    name: Paquete de Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Carga de trabajo de WebAssembly
        run: dotnet workload install wasm-tools
      - name: Pruebas
        run: dotnet test Plata.slnx -c Release
      - name: Armar el paquete
        run: empaquetado/linux/empaquetar.sh "${GITHUB_REF_NAME#v}"
      - name: Publicar la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --title "$GITHUB_REF_NAME" --generate-notes
