name: ci
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Instalar workload wasm-tools
        run: dotnet workload install wasm-tools
      - name: Dependencias Linux (WebKitGTK)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0
      - run: dotnet build Plata.slnx -c Release
      - run: dotnet test Plata.slnx -c Release --no-build
