name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compilar-y-probar:
    name: Compilar y probar (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Carga de trabajo de WebAssembly
        run: dotnet workload install wasm-tools
      - name: Dependencias de Linux (WebKitGTK)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0
      - name: Compilar
        run: dotnet build Plata.slnx -c Release
      - name: Pruebas
        run: dotnet test Plata.slnx -c Release --no-build
      - name: Pruebas de la extensión
        if: matrix.os == 'ubuntu-latest'
        working-directory: extension
        run: node --test
