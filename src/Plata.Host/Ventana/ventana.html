<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT -->
<!-- La ventana de Plata: una barra con pestañas (el portal y cada app abierta) y debajo el
     contenido de la pestaña activa. Cada pestaña es un marco: el portal con su sitio y cada app
     con su propio motor (plata://<id>/). Los mensajes de las apps al host pasan por acá, que
     sabe de qué pestaña vienen. El host completa los valores entre dobles guiones bajos. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>__NOMBRE__</title>
<style>
  :root {
    --barra: #2b2f35; --barra-borde: #1b1e22; --texto: #d7dbe0; --texto-tenue: #9aa1aa;
    --pestana-activa: #eef0f3; --texto-activo: #1f2328; --hover: #3a3f46; --acento: #b9c2cc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #eef0f3;
    font: 13px system-ui, -apple-system, "Segoe UI", Ubuntu, Cantarell, sans-serif; }
  #barra { position: absolute; inset: 0 0 auto 0; height: 38px; display: flex; align-items: flex-end;
    gap: 2px; padding: 0 8px; background: linear-gradient(#353a41, var(--barra));
    border-bottom: 1px solid var(--barra-borde); user-select: none; }
  #marca { display: flex; align-items: center; gap: 8px; height: 100%; padding: 0 14px 0 4px;
    color: var(--texto); font-weight: 600; letter-spacing: .3px; }
  #marca small { padding: 1px 6px; border: 1px solid #ffffff40; border-radius: 9px; color: var(--texto-tenue);
    font-size: 10.5px; font-weight: 500; letter-spacing: 0; }
  #marca small:empty { display: none; }
  #marca i { flex: none; width: 16px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #c7ccd2 45%, #7d848d); box-shadow: 0 0 0 1px #0004; }
  #pestanas { display: flex; align-items: flex-end; gap: 2px; height: 100%; min-width: 0; flex: 1; }
  .pestana { display: flex; align-items: center; gap: 8px; height: 31px; max-width: 220px; min-width: 0;
    padding: 0 10px 0 14px; border-radius: 8px 8px 0 0; color: var(--texto); cursor: default; }
  .pestana:hover { background: var(--hover); }
  .pestana.activa { background: var(--pestana-activa); color: var(--texto-activo); }
  .pestana span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .pestana button { flex: none; width: 18px; height: 18px; border: 0; border-radius: 50%; padding: 0;
    background: transparent; color: inherit; font-size: 14px; line-height: 18px; opacity: .6; cursor: pointer; }
  .pestana button:hover { opacity: 1; background: #0002; }
  #acciones { display: flex; align-items: center; gap: 10px; height: 100%; color: var(--texto-tenue); }
  .giro { width: 12px; height: 12px; border: 2px solid var(--texto-tenue); border-top-color: transparent;
    border-radius: 50%; animation: giro .8s linear infinite; }
  @keyframes giro { to { transform: rotate(360deg); } }
  #acciones button { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px;
    border: 0; border-radius: 6px; background: transparent; color: var(--texto); font-size: 16px; cursor: pointer; }
  #acciones button:hover { background: var(--hover); }
  #codigo[hidden] { display: none; }
  #contenido { position: absolute; inset: 38px 0 0 0; }
  #contenido iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
    background: #fff; visibility: hidden; }
  #contenido iframe.activa { visibility: visible; }
  .cargando { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: #eef0f3; color: #4b525b; font-size: 14px; z-index: 1;
    visibility: hidden; }
  .cargando.activa { visibility: visible; }
  .cargando .giro { width: 28px; height: 28px; border-width: 3px; border-color: #8b939c; border-top-color: transparent; }
  .cargando.fallo .giro { display: none; }
  #modal { position: absolute; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
    background: #0007; }
  #modal.visible { display: flex; }
  #modal .tarjeta { display: flex; flex-direction: column; align-items: center; gap: 18px; min-width: 340px;
    max-width: 560px; padding: 30px 36px; border-radius: 12px; background: #fff; color: #2b2f35;
    font-size: 15px; text-align: center; box-shadow: 0 16px 48px #0006; }
  #modal .giro { width: 34px; height: 34px; border-width: 3px; border-color: #8b939c; border-top-color: transparent; }
  #modal button { display: none; padding: 8px 22px; border: 0; border-radius: 6px; background: #2b2f35; color: #fff;
    font: inherit; cursor: pointer; }
  #modal.fallo .giro { display: none; }
  #modal.fallo button { display: block; }
</style>
</head>
<body>
<div id="barra">
  <div id="marca"><i></i><span>__MARCA__</span><small>__ETIQUETA__</small></div>
  <div id="pestanas"></div>
  <div id="acciones">
    <button id="recargar" title="Recargar la pestaña">&#x21bb;</button>
    <button id="codigo" title="Código fuente: ver, reportar o colaborar" hidden>
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </button>
  </div>
</div>
<div id="contenido"></div>
<div id="modal"><div class="tarjeta"><div class="giro"></div><div id="modal-texto"></div><button id="modal-cerrar">Cerrar</button></div></div>
<script>
(function () {
  'use strict';
  var TOKEN = '__TOKEN__';
  var pestanas = new Map(); // id -> { pestana, marco, app }
  var activa = null;

  function enviar(m) { window.external.sendMessage(m); }

  function crear(id, titulo, url, app) {
    var p = pestanas.get(id);
    if (p) {
      p.titulo = titulo;
      p.pestana.querySelector('span').textContent = titulo;
      p.marco.src = url;
      if (p.cargando) cargando(p, 'Abriendo ' + titulo + '\u2026');
      activar(id);
      return;
    }
    var pestana = document.createElement('div');
    pestana.className = 'pestana';
    pestana.title = titulo;
    var texto = document.createElement('span');
    texto.textContent = titulo;
    pestana.appendChild(texto);
    if (app) {
      var cerrar = document.createElement('button');
      cerrar.textContent = '×';
      cerrar.title = 'Cerrar';
      cerrar.addEventListener('click', function (e) { e.stopPropagation(); quitar(id); });
      pestana.appendChild(cerrar);
    }
    pestana.addEventListener('mousedown', function () { activar(id); });
    var marco = document.createElement('iframe');
    marco.src = url;
    document.getElementById('pestanas').appendChild(pestana);
    document.getElementById('contenido').appendChild(marco);
    var p2 = { pestana: pestana, marco: marco, app: app, titulo: titulo };
    if (app) {
      // Hasta que la app tiene algo en pantalla (el motor avisa "plata:visible").
      p2.cargando = document.createElement('div');
      p2.cargando.className = 'cargando';
      p2.cargando.innerHTML = '<div class="giro"></div><div></div>';
      document.getElementById('contenido').appendChild(p2.cargando);
      cargando(p2, 'Abriendo ' + titulo + '\u2026');
    }
    pestanas.set(id, p2);
    activar(id);
  }

  // Texto de carga de una app; null la oculta. "fallo" muestra el texto sin el indicador.
  function cargando(p, texto, fallo) {
    p.cargandoVisible = texto !== null;
    if (texto !== null) p.cargando.lastChild.textContent = texto;
    p.cargando.classList.toggle('fallo', !!fallo);
    p.cargando.classList.toggle('activa', p.cargandoVisible && activa === idDe(p));
  }
  function idDe(p) { var r = null; pestanas.forEach(function (q, k) { if (q === p) r = k; }); return r; }

  function activar(id) {
    activa = id;
    pestanas.forEach(function (p, k) {
      p.pestana.classList.toggle('activa', k === id);
      p.marco.classList.toggle('activa', k === id);
      if (p.cargando) p.cargando.classList.toggle('activa', k === id && p.cargandoVisible);
    });
    activa = id;
    var p = pestanas.get(id);
    if (p) p.marco.focus();
  }

  function quitar(id) {
    var p = pestanas.get(id);
    if (!p) return;
    p.pestana.remove();
    p.marco.remove();
    if (p.cargando) p.cargando.remove();
    pestanas.delete(id);
    enviar('plata-ventana:' + TOKEN + ':cerrar:' + id);
    if (activa === id) activar(pestanas.keys().next().value);
  }

  // Modal sobre toda la ventana: "Abriendo aplicación…" desde el clic en el portal hasta que
  // aparece la pestaña, o el motivo si no se pudo abrir.
  var esperaPortal;
  function modal(texto, fallo) {
    var m = document.getElementById('modal');
    clearTimeout(esperaPortal);
    m.classList.toggle('visible', texto !== null);
    m.classList.toggle('fallo', !!fallo);
    if (texto === null) return;
    document.getElementById('modal-texto').textContent = texto;
    if (!fallo) esperaPortal = setTimeout(function () { modal(null); }, 45000);
  }
  document.getElementById('modal-cerrar').addEventListener('click', function () { modal(null); });

  // Mensajes de las apps (desde su marco) hacia el host, con la pestaña de origen. Del portal solo
  // se acepta el aviso de que se hizo clic en una app.
  window.addEventListener('message', function (e) {
    if (!e.data) return;
    var portal = pestanas.get('portal');
    if (portal && e.source === portal.marco.contentWindow && e.data.plataPortal === 'abriendo') { modal('Abriendo aplicaci\u00f3n\u2026'); return; }
    if (typeof e.data.plata !== 'string') return;
    pestanas.forEach(function (p, id) {
      if (!p.app || p.marco.contentWindow !== e.source) return;
      var m = e.data.plata;
      if (m.indexOf('plata:visible') === 0) cargando(p, null);
      else if (m.indexOf('plata:error ') === 0 || m.indexOf('plata:startup-error ') === 0)
        cargando(p, 'No se pudo abrir ' + p.titulo + ': ' + m.slice(m.indexOf(' ') + 1), true);
      enviar('plata-app:' + TOKEN + ':' + id + ':' + m);
    });
  });

  // Mensajes del host: para una app ("plata-app:<id>:...") o para la ventana ("plata-ventana:{...}").
  window.external.receiveMessage(function (m) {
    if (m.indexOf('plata-app:') === 0) {
      var resto = m.slice(10), i = resto.indexOf(':');
      var p = pestanas.get(resto.slice(0, i));
      if (p) p.marco.contentWindow.postMessage({ plata: resto.slice(i + 1) }, '*');
      return;
    }
    if (m.indexOf('plata-ventana:') !== 0) return;
    var o = JSON.parse(m.slice(14));
    if (o.tipo === 'abriendo') modal('Abriendo aplicaci\u00f3n\u2026');
    if (o.tipo === 'app') { modal(null); crear(o.id, o.titulo, o.url, true); }
    if (o.tipo === 'error') modal(o.texto, true);
  });

  document.getElementById('recargar').addEventListener('click', function () {
    var p = pestanas.get(activa);
    if (!p) return;
    p.marco.src = p.marco.src;
    if (p.cargando) cargando(p, 'Abriendo ' + p.titulo + '\u2026');
  });

  // El botón al código fuente, si la app tiene repositorio.
  var codigo = document.getElementById('codigo');
  if (__CON_REPO__) {
    codigo.hidden = false;
    codigo.addEventListener('click', function () { enviar('plata-ventana:' + TOKEN + ':codigo'); });
  }

  crear('portal', '__PORTAL_TITULO__', '__PORTAL__', false);
})();
</script>
</body>
</html>
